name: gymini
description: "GYMINI - FitLife Tracker - Complete Fitness & Mental Health App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🧩 Core & UI
  cupertino_icons: ^1.0.8
  device_preview: ^1.1.0
  cached_network_image: ^3.3.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0

  # 🗃️ Database & Storage
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.1+2
  path: ^1.8.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ⚙️ State Management
  provider: ^6.1.1
  uuid: ^4.3.3
  intl: ^0.20.2

  # 🌐 Networking & Utilities
  http: ^1.2.0
  url_launcher: ^6.2.0
  image_picker: ^1.0.0
  mobile_scanner: ^5.2.3

  # 📅 Calendar & Notifications
  device_calendar: ^4.3.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  permission_handler: ^11.0.1

  # 🎉 Fun / Engagement
  confetti: ^0.7.0
  share_plus: ^7.0.0
  youtube_player_flutter: ^9.0.3
  flutter_inappwebview: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/meditation/
    - assets/backgrounds/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: fonts/Poppins-Regular.ttf
  #       - asset: fonts/Poppins-Bold.ttf
  #         weight: 700
