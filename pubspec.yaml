name: gymini
description: "GYMINI - FitLife Tracker - Complete Fitness & Mental Health App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  device_preview: ^1.1.0

  # ===== IMAGE NETWORK =====
  cached_network_image: ^3.3.0  # AJOUTÉ ICI

  # ===== STORAGE & DATABASE =====
  # SQLite Database (avec support desktop)
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.1+2
  path: ^1.8.3

  path_provider: ^2.1.2

  # Hive (pour le cache rapide)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Shared Preferences
  shared_preferences: ^2.2.2

  # ===== NETWORK & APIS =====
  http: ^1.2.0
  geolocator: ^11.0.1
  url_launcher: ^6.1.11

  # ===== UI COMPONENTS & CHARTS =====
  fl_chart: ^0.66.2

  # ===== HEALTH & FITNESS =====
  health: ^13.2.1

  # ===== ANIMATIONS =====
  flutter_animate: ^4.5.0

  # ===== STATE MANAGEMENT =====
  provider: ^6.1.1

  # ===== UTILITIES =====
  uuid: ^4.3.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/meditation/
    - assets/backgrounds/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: fonts/Poppins-Regular.ttf
  #       - asset: fonts/Poppins-Bold.ttf
  #         weight: 700