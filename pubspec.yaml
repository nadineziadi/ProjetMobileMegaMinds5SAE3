  mobile_scanner: ^5.2.3

  # 🎉 Fun / Engagement
  confetti: ^0.7.0
  share_plus: ^7.0.0
  youtube_player_flutter: ^9.0.3
  flutter_inappwebview: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

