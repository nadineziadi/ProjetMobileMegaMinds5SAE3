name: gymini
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # 🧩 Core & UI
  cupertino_icons: ^1.0.8
  device_preview: ^1.1.0

  # 🗃️ Database & Storage
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  hive: ^2.2.3
