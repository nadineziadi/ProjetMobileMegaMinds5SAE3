name: gymini
description: "GYMINI - FitLife Tracker App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_preview: ^1.1.0

  # State Management & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Charts
  fl_chart: ^0.65.0

  shared_preferences: ^2.2.2


  # Utils
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
